server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/xml;

    # ES modules must have a JavaScript MIME type for the browser to load them.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ { add_header Cache-Control "public, max-age=3600"; }
    location /play/   { add_header Cache-Control "public, max-age=3600"; }

    error_page 404 /404.html;
}

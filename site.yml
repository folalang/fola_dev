title: Fola
tagline: A Ruby-like language with a Zig heart
description: Fola is a Ruby-like programming language implemented in Zig, with Ruby syntax, gradual typing, a batteries-included standard library and a WebAssembly runtime.
base_url: https://fola.dev
repo: https://github.com/kamalogudah/fola
site_repo: https://github.com/kamalogudah/fola_dev
output: public

# Sections appear in the header in this order. Each page belongs to one.
sections:
  - id: learn
    title: Learn
  - id: tutorials
    title: Tutorials
  - id: spec
    title: Spec
  - id: guides
    title: Guides
  - id: stdlib
    title: Stdlib
  - id: contribute
    title: Contribute

# Markdown pulled straight from the Fola repository (FOLA_REPO, default
# ../fola) at build time, so the reference never drifts from the code.
# The page title comes from the file's first "# " heading.
